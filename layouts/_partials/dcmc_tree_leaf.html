{{- /* 目录树叶子节点（具体文章页，无子项） */ -}}
{{- $page := .page -}}
{{- $depth := .depth -}}
{{- $cur := .cur -}}
{{- $isActive := eq $page.Permalink $cur -}}
<div class="dcmc-nav-item dcmc-nav-leaf{{ if $isActive }} is-active{{ end }}"
  data-depth="{{ $depth }}" style="--depth: {{ $depth }};">
  <div class="dcmc-nav-row">
    <span class="dcmc-nav-chevron dcmc-chevron-placeholder" aria-hidden="true"></span>
    <a href="{{ $page.Permalink }}" class="dcmc-nav-link{{ if $isActive }} is-current{{ end }}">{{ $page.Title }}</a>
  </div>
</div>
