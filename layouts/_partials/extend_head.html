{{- /* 扩展头部：KaTeX CSS + 三栏布局 CSS + 代码块美化 */ -}}
{{- if .IsPage }}

{{- /* 1. KaTeX CSS（用于数学公式 + mhchem 化学符号） */ -}}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
  integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">

{{- /* 2. 三栏布局（仅文章详情页 & 大屏显示） */ -}}
<style>
  /* === 三栏布局：左栏(文章导航) + 中栏(正文) + 右栏(页内目录) === */
  /* 关键：增加 (hover: hover) 和 (pointer: fine) 防止触屏手机开启桌面模式时误触发 */
  @media screen and (min-width: 1280px) and (hover: hover) and (pointer: fine) {
    body.layout-page .main {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 280px;
      gap: 32px;
      max-width: 1600px !important;
      padding: 40px 24px !important;
    }
    #left-sidebar {
      grid-column: 1;
      order: 1;
      position: sticky;
      top: calc(var(--height-header, 64px) + 24px);
      align-self: start;
      max-height: calc(100vh - var(--height-header, 64px) - 48px);
      overflow-y: auto;
      padding: 20px 16px;
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 12px;
      background: var(--entry, #fff);
      font-size: 14px;
      scrollbar-width: thin;
    }
    #left-sidebar::-webkit-scrollbar { width: 6px; }
    #left-sidebar::-webkit-scrollbar-thumb { background: var(--tertiary, #cbd5e1); border-radius: 3px; }
    body.layout-page .post {
      grid-column: 2;
      order: 2;
      margin: 0 !important;
      max-width: none !important;
    }
    #right-toc {
      grid-column: 3;
      order: 3;
      position: sticky;
      top: calc(var(--height-header, 64px) + 24px);
      align-self: start;
      max-height: calc(100vh - var(--height-header, 64px) - 48px);
      overflow-y: auto;
      padding: 20px 16px;
      border: 1px solid var(--border, #e5e7eb);
      border-radius: 12px;
      background: var(--entry, #fff);
      scrollbar-width: thin;
    }
    #right-toc::-webkit-scrollbar { width: 6px; }
    #right-toc::-webkit-scrollbar-thumb { background: var(--tertiary, #cbd5e1); border-radius: 3px; }
    #right-toc h3.toc-title { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: var(--secondary, #475569); }
    #right-toc #TableOfContents ul { padding-left: 16px; margin: 0; }
    #right-toc #TableOfContents > ul { padding-left: 0; }
    #right-toc #TableOfContents li { margin: 6px 0; line-height: 1.4; list-style: none; position: relative; }
    #right-toc #TableOfContents li > a {
      display: block;
      padding: 3px 8px;
      border-radius: 6px;
      color: var(--secondary, #475569) !important;
      text-decoration: none !important;
      font-size: 13px;
      transition: all .15s ease;
      border-left: 2px solid transparent;
      padding-left: 10px;
    }
    #right-toc #TableOfContents li > a:hover {
      background: var(--tertiary-bg, rgba(0,0,0,.04));
      color: var(--content, #111) !important;
    }
    #right-toc #TableOfContents li.active > a {
      border-left-color: var(--link-background, #3b82f6);
      color: var(--link-background, #3b82f6) !important;
      font-weight: 600;
    }
    /* 原来 PaperMod 的内联 TOC（details.toc）在大屏时隐藏 */
    body.layout-page .post-single > details.toc { display: none !important; }
  }

  /* 左栏文章导航样式 */
  #left-sidebar .sidebar-title {
    margin: 0 0 12px;
    font-size: 13px;
    font-weight: 600;
    color: var(--secondary, #475569);
    letter-spacing: .02em;
    text-transform: uppercase;
  }
  #left-sidebar .post-list { list-style: none; padding: 0; margin: 0; }
  #left-sidebar .post-list .post-item { margin: 2px 0; }
  #left-sidebar .post-list .post-item a {
    display: block;
    padding: 6px 10px;
    border-radius: 6px;
    color: var(--content, #1f2937) !important;
    text-decoration: none !important;
    line-height: 1.35;
    transition: all .15s ease;
  }
  #left-sidebar .post-list .post-item a:hover {
    background: var(--tertiary-bg, rgba(0,0,0,.04));
  }
  #left-sidebar .post-list .post-item.current a {
    background: var(--link-background-2, rgba(59,130,246,.12));
    color: var(--link-background, #3b82f6) !important;
    font-weight: 600;
  }
  #left-sidebar .section-group { margin: 14px 0 4px; }
  #left-sidebar .section-group-title {
    font-size: 12px;
    color: var(--tertiary, #64748b);
    padding: 4px 10px;
    margin-bottom: 4px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .03em;
  }

  /* === 代码块美化（PaperMod 已有 highlight，此为增强） === */
  .post-content .highlight {
    position: relative;
    border-radius: 10px;
    border: 1px solid var(--border, #e5e7eb);
    overflow: hidden;
    margin: 20px 0;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
  }
  .post-content .highlight pre {
    margin: 0;
    padding: 16px 18px;
    font-size: 14px;
    line-height: 1.65;
    overflow-x: auto;
  }
  .post-content .highlight pre code {
    background: none !important;
    padding: 0 !important;
  }
  /* 行内 code */
  .post-content :not(pre) > code {
    padding: 2px 7px;
    border-radius: 5px;
    background: var(--code-bg, rgba(0,0,0,.06));
    font-size: .92em;
    border: 1px solid var(--border, rgba(0,0,0,.08));
  }
  /* 复制按钮美化 */
  .post-content .highlight button.code-copy-btn,
  .post-content .highlight button.copy-code-button {
    position: absolute;
    top: 8px;
    right: 8px;
    padding: 4px 10px;
    font-size: 12px;
    border-radius: 6px;
    border: 1px solid var(--border, rgba(0,0,0,.1));
    background: var(--code-bg, rgba(255,255,255,.8));
    backdrop-filter: blur(6px);
    cursor: pointer;
    opacity: 0;
    transition: opacity .2s;
  }
  .post-content .highlight:hover button.code-copy-btn,
  .post-content .highlight:hover button.copy-code-button { opacity: 1; }

  /* KaTeX 显示公式块容器 */
  .katex-display {
    overflow-x: auto;
    overflow-y: hidden;
    padding: 8px 4px;
  }

  /* === 化学结构式（SmilesDrawer） === */
  .chem-structure {
    text-align: center;
    margin: 20px 0;
    padding: 16px;
    border: 1px solid var(--border, #e5e7eb);
    border-radius: 10px;
    background: var(--code-bg, rgba(0,0,0,.02));
    overflow-x: auto;
  }
  .chem-structure svg { max-width: 100%; height: auto; }
  .chem-caption {
    margin: 8px 0 0;
    font-size: 13px;
    color: var(--secondary, #64748b);
    font-style: italic;
  }
</style>

{{- end }}{{- /* .IsPage */ -}}
