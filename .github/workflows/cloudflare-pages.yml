name: Deploy Hugo to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Download cell images
        # 用 Special:FilePath 重定向，自动解析真实存储路径
        # 加 User-Agent + 多次重试 + 备用 thumb 路径，应对 Wikimedia 随机 503/限流
        # 即使某张图最终下载失败，也用占位 SVG 替代，不阻塞整体构建
        run: |
          mkdir -p static/images/cell
          UA="Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0"
          BASE="https://commons.wikimedia.org/wiki/Special:FilePath"
          # 目标保存名 -> Wikimedia 源文件名
          declare -A IMGS=(
            ["prokaryotic-vs-eukaryotic.png"]="Prokaryotic_vs_eukaryotic_cell.png"
            ["prokaryote-cell.svg"]="Average_prokaryote_cell_-_en.svg"
            ["endosymbiosis.svg"]="Endosymbiotic_theory.svg"
            ["animal-cell.svg"]="Animal_Cell.svg"
            ["plant-cell.png"]="Plant_cell_structure.png"
          )

          download() {
            local src="$1" out="$2"
            # 尝试 Special:FilePath（跟随重定向到真实路径）
            for i in 1 2 3 4 5; do
              curl -sSL -A "$UA" --max-time 30 -o "static/images/cell/$out" "$BASE/$src"
              size=$(stat -c%s "static/images/cell/$out" 2>/dev/null || echo 0)
              if [ "$size" -ge 5000 ]; then
                echo "  OK (try $i): $size bytes"
                return 0
              fi
              echo "  retry $i: got $size bytes, waiting ${i}s..."
              sleep "$i"
            done
            return 1
          }

          for out in "${!IMGS[@]}"; do
            src="${IMGS[$out]}"
            echo "Downloading $src -> $out"
            if download "$src" "$out"; then
              :
            else
              echo "  WARN: $out failed after retries, generating placeholder"
              printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
                '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">' \
                '<rect width="400" height="200" fill="#f5f5f5" stroke="#ccc"/>' \
                '<text x="200" y="100" text-anchor="middle" fill="#999" font-family="sans-serif" font-size="14">图片加载失败</text>' \
                '<text x="200" y="120" text-anchor="middle" fill="#999" font-family="sans-serif" font-size="12">请稍后刷新</text>' \
                '</svg>' > "static/images/cell/$out"
            fi
          done
          ls -lh static/images/cell/

      - name: Build
        run: |
          # 中文文件名需要关闭 quotepath，否则 Hugo 的 GitInfo 拿不到 git log 时间，
          # 导致 lastmod 回退为 date，同 date 文章排序不稳定
          git config core.quotepath false
          hugo --gc --minify

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=hugo-blog-wunai --branch=main
