name: Deploy Hugo to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Download cell images
        # 用 Special:FilePath 重定向，自动解析真实存储路径
        # 加 User-Agent + 多次重试 + 备用 thumb 路径，应对 Wikimedia 随机 503/限流
        # 即使某张图最终下载失败，也用占位 SVG 替代，不阻塞整体构建
        run: |
          mkdir -p static/images/cell
          UA="Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0"
          BASE="https://commons.wikimedia.org/wiki/Special:FilePath"
          # 目标保存名 -> Wikimedia 源文件名
          declare -A IMGS=(
            ["prokaryotic-vs-eukaryotic.png"]="Prokaryotic_vs_eukaryotic_cell.png"
            ["prokaryote-cell.svg"]="Average_prokaryote_cell_-_en.svg"
            ["endosymbiosis.svg"]="Endosymbiotic_theory.svg"
            ["animal-cell.svg"]="Animal_Cell.svg"
            ["plant-cell.png"]="Plant_cell_structure.png"
          )

          download() {
            local src="$1" out="$2"
            # 尝试 Special:FilePath（跟随重定向到真实路径）
            for i in 1 2 3 4 5; do
              curl -sSL -A "$UA" --max-time 30 -o "static/images/cell/$out" "$BASE/$src"
              size=$(stat -c%s "static/images/cell/$out" 2>/dev/null || echo 0)
              if [ "$size" -ge 5000 ]; then
                echo "  OK (try $i): $size bytes"
                return 0
              fi
              echo "  retry $i: got $size bytes, waiting ${i}s..."
              sleep "$i"
            done
            return 1
          }

          for out in "${!IMGS[@]}"; do
            src="${IMGS[$out]}"
            echo "Downloading $src -> $out"
            if download "$src" "$out"; then
              :
            else
              echo "  WARN: $out failed after retries, generating placeholder"
              printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' \
                '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">' \
                '<rect width="400" height="200" fill="#f5f5f5" stroke="#ccc"/>' \
                '<text x="200" y="100" text-anchor="middle" fill="#999" font-family="sans-serif" font-size="14">图片加载失败</text>' \
                '<text x="200" y="120" text-anchor="middle" fill="#999" font-family="sans-serif" font-size="12">请稍后刷新</text>' \
                '</svg>' > "static/images/cell/$out"
            fi
          done
          ls -lh static/images/cell/

      - name: Generate build-info.json
        # 拉取「上一次」的 GitHub workflow run 和 Cloudflare deployment 信息，
        # 写入 static/build-info.json 供 /status 页面展示。
        # 两边都取最新一条（不限成败），语义为「上一次完成的构建」。
        # 当前正在跑的这次还没完成，所以拿到的就是上一次。
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p static
          INFO_FILE="static/build-info.json"
          GENERATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # ===== GitHub 侧：最近一次 completed 的 workflow run =====
          GH_DATA='{}'
          if [ -n "$GH_TOKEN" ]; then
            GH_RESP=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?status=completed&per_page=1" 2>/dev/null || echo '')
            if [ -n "$GH_RESP" ] && echo "$GH_RESP" | jq -e '.workflow_runs[0]' >/dev/null 2>&1; then
              GH_DATA=$(echo "$GH_RESP" | jq '.workflow_runs[0] | {
                run_id: .id,
                run_number: .run_number,
                status: .status,
                conclusion: .conclusion,
                html_url: .html_url,
                run_started_at: .run_started_at,
                updated_at: .updated_at,
                event: .event,
                head_branch: .head_branch,
                commit_sha: .head_sha,
                commit_message: (.head_commit.message | split("\n")[0]),
                commit_author: .head_commit.author.name
              }')
            fi
          fi

          # ===== Cloudflare 侧：最新 deployment =====
          CF_DATA='{}'
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            CF_RESP=$(curl -fsSL \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/hugo-blog-wunai/deployments?per_page=1&sort=created_on%3Adesc" 2>/dev/null || echo '')
            if [ -n "$CF_RESP" ] && echo "$CF_RESP" | jq -e '.result[0]' >/dev/null 2>&1; then
              CF_DATA=$(echo "$CF_RESP" | jq '.result[0] | {
                id: .id,
                environment: .environment,
                created_on: .created_on,
                latest_stage: { name: .latest_stage.name, status: .latest_stage.status },
                url: .url,
                aliases: .aliases,
                is_skipped: .is_skipped
              }')
            fi
          fi

          # ===== 合并写入 =====
          jq -n \
            --arg generated_at "$GENERATED_AT" \
            --argjson github "$GH_DATA" \
            --argjson cloudflare "$CF_DATA" \
            '{generated_at: $generated_at, github: $github, cloudflare: $cloudflare}' \
            > "$INFO_FILE"

          echo "=== build-info.json ==="
          cat "$INFO_FILE"

      - name: Build
        run: |
          # 中文文件名需要关闭 quotepath，否则 Hugo 的 GitInfo 拿不到 git log 时间，
          # 导致 lastmod 回退为 date，同 date 文章排序不稳定
          git config core.quotepath false
          hugo --gc --minify

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=hugo-blog-wunai --branch=main
